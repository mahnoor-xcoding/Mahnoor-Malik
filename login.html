<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

    <!-- Bootstrap CSS -->
    <link rel="stylesheet" href="bootstrap.min.css">

    <!-- Custom CSS -->
    <link rel="stylesheet" href="watch.css">

    <title>TIMEZONE - Account</title>

</head>


<body>


    <!-- Background img -->
    
    <img src="watchback.jpg" class="background-image" alt="">


    <!-- Navbar -->

    <nav class="navbar">

        <div class="container-fluid">

            <a class="navbar-brand"
                href="home.html">
                TIMEZONE
            </a>

            <div class="navbar-nav ms-auto
                        d-flex flex-row
                        flex-wrap
                        justify-content-center
                        gap-2">

                <a href="home.html"
                    class="nav-link">
                    Home
                </a>

                <a href="shop.html"
                    class="nav-link">
                    Shop
                </a>

                <a href="cart.html"
                    class="nav-link">
                    Cart
                </a>

                <a href="login.html"
                    class="nav-link">
                    Account
                </a>

            </div>

        </div>

    </nav>


    <!-- Account -->

    <main class="container my-5">

        <div class="row justify-content-center">

            <div class="col-12 col-sm-10 col-md-8 col-lg-6 col-xl-5">

                <section class="login-section">

                    <h2 class="text-center">
                        Create Account
                    </h2>


                    <form>


                        <!-- Username -->

                        <div class="mb-3">

                            <label for="username"
                                class="form-label">
                                Username
                            </label>

                            <input
                                type="text"
                                id="username"
                                name="username"
                                class="form-control"
                                placeholder="Enter your username"
                            >

                        </div>


                        <!-- Email -->

                        <div class="mb-3">

                            <label for="email"
                                class="form-label">
                                Email
                            </label>

                            <input
                                type="email"
                                id="email"
                                name="email"
                                class="form-control"
                                placeholder="Enter your email"
                            >

                        </div>


                        <!-- Bio -->

                        <div class="mb-3">

                            <label for="bio"
                                class="form-label">
                                Bio
                            </label>

                            <textarea
                                id="bio"
                                name="bio"
                                class="form-control"
                                placeholder="Tell us something about yourself"
                                maxlength="150"
                                rows="4"
                            ></textarea>

                            <small id="bio-count"
                                class="d-block mt-1">
                                0 / 150
                            </small>

                        </div>


                        <!-- Password -->

                        <div class="mb-3">

                            <label for="password"
                                class="form-label">
                                Password
                            </label>

                            <input
                                type="password"
                                id="password"
                                name="password"
                                class="form-control"
                                placeholder="Create a strong password"
                            >

                            <small
                                id="password-message"
                                class="d-block mt-1">

                                Password must be at least 6 characters
                                with a letter, number and special character.

                            </small>

                        </div>


                        <!-- Submit -->

                        <div class="text-center">

                            <button
                                type="submit"
                                class="btn">

                                Create Account

                            </button>

                        </div>


                    </form>

                </section>

            </div>

        </div>

    </main>


    <!-- Footer -->

    <footer class="footer container-fluid text-center py-4">

        <h3>TIMEZONE</h3>

        <p>
            © 2026 TIMEZONE. All Rights Reserved.
        </p>
        <p>
            Ticktock: @Maha_xwhy
        </p>
        <p>
            Instagram: malik_xcheery5888
        </p>

    </footer>


    <!-- JavaScript -->

    <script src="watch.js"></script>

</body>

</html>
